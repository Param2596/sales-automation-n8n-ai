<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>test webpage</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Lead Intake</h1>
  <form id="lead-form">
    <label>Name <input name="name" required /></label>
    <label>Email <input name="email" type="email" required /></label>
    <label>Company <input name="company" required /></label>
    <label>Website <input name="website" type="url" placeholder="https://" /></label>
    <label>Service
      <select name="service" required>
        <option>SOC</option><option>MDR</option><option>EDR</option><option>DLP</option>
        <option>Email Security</option><option>Pentest</option><option>Incident Response</option>
      </select>
    </label>
    <label>Message <textarea name="message" rows="4"></textarea></label>
    <button type="submit">Submit</button>
  </form>
  <pre id="result"></pre>

  <script>
    const WEBHOOK_URL = "http://localhost:5678/webhook/lead";
    const API_KEY = "dev-only-key"; // demo only; never ship a real key in browser code

    document.getElementById("lead-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const out = document.getElementById("result");
      out.textContent = "Sending...";
      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Api-Key": API_KEY },
          body: JSON.stringify(data),
        });
        const text = await res.text();
        out.textContent = `HTTP ${res.status}\n${text}`;
      } catch (err) {
        out.textContent = `Request failed: ${err.message} (check CORS / n8n running)`;
      }
    });
  </script>
</body>
</html>
